<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="keywords" content="临时邮箱,forsaken mail,disposable mail">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forsaken Mail</title>
  <link href="https://lib.baomitu.com/semantic-ui/2.1.7/semantic.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/prism.css">
</head>
<body>
<div class="app-shell">
  <header class="hero">
    <div class="hero__inner">
      <div class="hero__brand">
        <div class="hero__logo">✉️</div>
        <div>
          <div class="hero__eyebrow">临时邮箱 / Disposable Inbox</div>
          <h1>Forsaken Mail</h1>
          <p>匿名用户默认随机地址、不保留邮件；登录后可自定义前缀，并查看持久化历史。</p>
        </div>
      </div>
      <div class="hero__actions">
        <button class="ui button basic inverted mini" id="refreshShortidTop">
          <i class="refresh icon"></i>换一个地址
        </button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="mailbox-card">
      <div class="mailbox-card__top">
        <div>
          <div class="mailbox-card__label">当前邮箱</div>
          <div class="mailbox-card__addressRow">
            <input id="shortid" type="text" placeholder="请等待分配临时邮箱" disabled>
            <button class="ui icon button primary copy-btn" id="copyAddressBtn" title="复制邮箱地址">
              <i class="copy icon copyable"></i>
            </button>
          </div>
        </div>
        <div class="mailbox-card__tools">
          <button class="ui button basic small" id="refreshShortid">
            <i class="refresh icon"></i>
            随机生成
          </button>
          <button class="ui button basic small" id="customShortid" disabled>
            <i class="edit icon"></i>
            自定义前缀
          </button>
        </div>
      </div>
      <div class="mailbox-card__meta">
        <div class="meta-chip"><span class="meta-chip__label">收件数</span><strong id="mailCount">0</strong></div>
        <div class="meta-chip"><span class="meta-chip__label">状态</span><strong id="connectionStatus">连接中</strong></div>
        <div class="meta-chip"><span class="meta-chip__label">模式</span><strong id="inboxMode">匿名临时</strong></div>
        <div class="meta-chip"><span class="meta-chip__label">提示</span><span id="mailTip">新邮件会自动刷新显示</span></div>
      </div>
      <div class="owner-panel" id="ownerPanel">
        <div class="owner-panel__status" id="ownerStatusText">未登录：只能使用随机前缀，邮件不会持久保存。</div>
        <div class="owner-panel__actions" id="ownerLoginForm">
          <div class="ui small input">
            <input type="password" id="ownerPassword" placeholder="输入管理密码">
          </div>
          <button class="ui small primary button" id="ownerLoginBtn">登录持久模式</button>
        </div>
        <div class="owner-panel__actions" id="ownerLogoutBox" style="display:none;">
          <div class="ui small input">
            <input type="password" id="ownerCurrentPassword" placeholder="当前密码">
          </div>
          <div class="ui small input">
            <input type="password" id="ownerNewPassword" placeholder="新密码（至少 8 位）">
          </div>
          <button class="ui small primary button" id="ownerChangePasswordBtn">修改密码</button>
          <button class="ui small button" id="ownerLogoutBtn">退出登录</button>
        </div>
      </div>
    </section>

    <section class="inbox-layout">
      <aside class="inbox-panel">
        <div class="panel-header">
          <div>
            <h2>收件箱</h2>
            <p>点击左侧邮件查看正文</p>
          </div>
        </div>
        <div class="mail-list" id="maillist"></div>
        <div class="mail-list__empty" id="emptyState">
          <div class="mail-list__emptyIcon">📭</div>
          <div class="mail-list__emptyTitle">暂时还没有邮件</div>
          <div class="mail-list__emptyText">把这个地址填到目标网站里，收到信后这里会自动出现。</div>
        </div>
      </aside>

      <section class="mail-view">
        <div class="mail-view__header">
          <div>
            <div class="mail-view__kicker">邮件详情</div>
            <h2 id="mailSubject">我的邮件在哪里？</h2>
          </div>
          <button class="ui button basic small" id="viewRawBtn" disabled>
            <i class="code icon"></i>
            查看原始数据
          </button>
        </div>

        <div class="mail-meta" id="mailMeta">
          <div class="mail-meta__item">
            <span>发件人</span>
            <strong id="mailFrom">—</strong>
          </div>
          <div class="mail-meta__item">
            <span>收件人</span>
            <strong id="mailTo">—</strong>
          </div>
          <div class="mail-meta__item">
            <span>时间</span>
            <strong id="mailTime">—</strong>
          </div>
        </div>

        <article class="mail-body" id="mailBody">
          <div class="mail-placeholder">
            <div class="mail-placeholder__emoji">👀</div>
            <h3>先收一封试试</h3>
            <p>新邮件来了以后，这里会展示 HTML 正文或纯文本内容。</p>
          </div>
        </article>
      </section>
    </section>
  </main>
</div>

<div class="ui modal" id="raw">
  <div class="header"></div>
  <div class="content"></div>
</div>

<script src="https://lib.baomitu.com/jquery/2.1.4/jquery.min.js"></script>
<script src="https://lib.baomitu.com/semantic-ui/2.1.7/semantic.min.js"></script>
<script src="https://lib.baomitu.com/socket.io/1.3.7/socket.io.min.js"></script>
<script src="https://lib.baomitu.com/clipboard.js/1.5.5/clipboard.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/prism.js"></script>
</body>
</html>
